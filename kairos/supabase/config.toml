# Supabase project config for the Kairos relay.
# The relay authenticates every call with a per-mailbox bearer token (see
# functions/relay/handler.ts), not with Supabase Auth, so JWT verification is off.
project_id = "kairos"

[functions.relay]
verify_jwt = false

# The backup authenticates every call with a Sign in with Apple identity token (see functions/tender-backup/verify.ts).
[functions.tender-backup]
verify_jwt = false
